<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>About — Nick Kourakis</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Space+Grotesk:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #FAF7F3;
    --bg-alt: #F1ECE4;
    --bg-alt-2: #E9E2D8;
    --text: #1B1D22;
    --text-muted: #6B6A63;
    --accent: #9C6427;
    --accent-soft: rgba(156, 100, 39, 0.10);
    --border: #E1D9CC;
    --font-display: 'Fraunces', Georgia, serif;
    --font-body: 'Space Grotesk', -apple-system, sans-serif;
  }

  html[data-theme="dark"] {
    --bg: #12141A;
    --bg-alt: #191C23;
    --bg-alt-2: #1F232C;
    --text: #E9E7E2;
    --text-muted: #9B9C97;
    --accent: #C98B3E;
    --accent-soft: rgba(201, 139, 63, 0.14);
    --border: #2A2E37;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body { height: 100%; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--font-body);
    line-height: 1.6;
    overflow: auto;
    transition: background 0.25s ease, color 0.25s ease;
    background-image: radial-gradient(circle, var(--border) 0.6px, transparent 0.6px);
    background-size: 28px 28px;
  }

  a { color: inherit; text-decoration: none; }

  .wrap { max-width: 1120px; margin: 0 auto; padding: 0 1.75rem; }

  /* ---------- Header ---------- */

  header.top { flex: 0 0 auto; padding-top: 1.5rem; padding-bottom: 1.5rem; border-bottom: 1px solid var(--border); }

  .top-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .contact-links { display: flex; gap: 1.5rem; }

  .contact-links a {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    color: var(--text-muted);
    font-size: 0.9rem;
    transition: color 0.2s ease;
  }
  .contact-links a:hover { color: var(--accent); }
  .contact-links svg { width: 15px; height: 15px; }

  #theme-toggle {
    background: none;
    border: 1px solid var(--border);
    border-radius: 999px;
    width: 38px;
    height: 38px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    color: var(--text-muted);
    transition: border-color 0.2s ease, color 0.2s ease;
  }
  #theme-toggle:hover { border-color: var(--accent); color: var(--accent); }
  #theme-toggle svg { width: 17px; height: 17px; }
  html[data-theme="light"] .icon-sun { display: block; }
  html[data-theme="light"] .icon-moon { display: none; }
  html[data-theme="dark"] .icon-sun { display: none; }
  html[data-theme="dark"] .icon-moon { display: block; }

  /* ---------- Content ---------- */

  main { padding: 3rem 0; flex: 1; }

  main h1 {
    font-family: var(--font-display);
    font-weight: 500;
    font-size: clamp(2rem, 3vw, 2.8rem);
    line-height: 1.2;
    margin-bottom: 2rem;
  }

  main p, main li {
    max-width: 65ch;
    margin-bottom: 1rem;
    color: var(--text-muted);
  }

  .back-link {
    display: inline-block;
    margin-bottom: 2rem;
    color: var(--accent);
    font-size: 0.95rem;
    transition: opacity 0.2s ease;
  }
  .back-link:hover { opacity: 0.7; }

  a:focus-visible, button:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }
</style>
</head>
<body>

<header class="top">
  <div class="wrap top-row">
    <div class="contact-links">
      <a href="mailto:nicholaskourakis2004@gmail.com">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="2.5" y="5" width="19" height="14" rx="1.5"/><path d="m3 6.5 9 6.5 9-6.5"/></svg>
        nicholaskourakis2004@gmail.com
      </a>
      <a href="https://www.linkedin.com/in/nick-kourakis-302526279/" target="_blank" rel="noopener">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="2.5" y="2.5" width="19" height="19" rx="2"/><path d="M7.5 10v6.5M7.5 7.2v.1M12 16.5V12.8c0-1.5 1-2.6 2.5-2.6s2.5 1 2.5 2.6v3.7"/></svg>
        LinkedIn
      </a>
    </div>
    <button id="theme-toggle" aria-label="Toggle color theme">
      <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="12" r="4.5"/><path d="M12 2.5v2.2M12 19.3v2.2M4.2 4.2l1.6 1.6M18.2 18.2l1.6 1.6M2.5 12h2.2M19.3 12h2.2M4.2 19.8l1.6-1.6M18.2 5.8l1.6-1.6"/></svg>
      <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M20 14.5A8.5 8.5 0 1 1 9.5 4a7 7 0 0 0 10.5 10.5Z"/></svg>
    </button>
  </div>
</header>

<main>
  <div class="wrap">
    <a href="NickKourakisWebsite.html" class="back-link">← Back</a>
    <h1>About</h1>
    <!-- Add your about content here -->
  </div>
</main>

<script>
  const toggle = document.getElementById('theme-toggle');
  const root = document.documentElement;
  toggle.addEventListener('click', () => {
    const next = root.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
    root.setAttribute('data-theme', next);
  });
</script>

</body>
</html>
